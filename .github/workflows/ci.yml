name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Агент GitHub Actions на самом сервере: входящий SSH из интернета не нужен.
    runs-on: [self-hosted, arm-monitor]
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy
        run: |
          # .env и venv живут только на сервере — rsync их не трогает
          rsync -a --delete             --exclude '.env' --exclude '.venv' --exclude '__pycache__' --exclude '*.db'             backend/ /opt/arm-monitor/backend/
          rsync -a --delete frontend/dist/ /opt/arm-monitor/www/
          install -m 755 deploy/deploy.sh /opt/arm-monitor/deploy.sh
          bash /opt/arm-monitor/deploy.sh
